name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libgl1-mesa-dev libasound2-dev libfreetype6-dev libx11-dev libxinerama-dev libxcursor-dev libcurl4-openssl-dev
          git clone --depth 1 --branch 8.0.1 https://github.com/juce-framework/JUCE.git /tmp/JUCE
          cd /tmp/JUCE && cmake -B build && sudo cmake --install build
      - name: Generate BinaryData
        run: python3 generate_binary.py
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release .
      - name: Build
        run: cmake --build build --config Release -j$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plateau-Linux
          path: build/Plateau_artefacts/Release/VST3/Plateau.vst3/

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake mingw-w64
          git clone --depth 1 --branch 8.0.1 https://github.com/juce-framework/JUCE.git /tmp/JUCE
          cd /tmp/JUCE && cmake -B build -DCMAKE_BUILD_TYPE=Release . && sudo cmake --install build
      - name: Generate BinaryData
        run: python3 generate_binary.py
      - name: Configure
        run: cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-w64-mingw32-cross.cmake -DCMAKE_BUILD_TYPE=Release .
      - name: Build
        run: cmake --build build-win --config Release -j$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plateau-Windows
          path: build-win/Plateau_artefacts/Release/VST3/Plateau.vst3/
